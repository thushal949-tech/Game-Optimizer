workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Fix Missing Assets in App Config
        script: |
          node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          delete config.expo.icon;
          delete config.expo.splash;
          if (config.expo.android) delete config.expo.android.adaptiveIcon;
          if (config.expo.web) delete config.expo.web.favicon;
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2));
          "
      - name: Generate Android Native Project
        script: |
          npx expo prebuild --platform android --no-install
      - name: Build Android Release APK
        script: |
          cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
