workflows:
  android-build:
    name: Android Low End Optimized Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - supabase_keys
      vars:
        NODE_VERSION: 20.x
        NODE_ENV: production
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate .env file
        script: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
      - name: Run Expo Prebuild with Inline Assets
        script: |
          # Create assets directory dynamically
          mkdir -p assets/images
          if [ -f "icon.jpg" ]; then
            cp icon.jpg assets/images/icon.png
            cp icon.jpg assets/images/adaptive-icon.png
          elif [ -f "icon.png" ]; then
            cp icon.png assets/images/icon.png
            cp icon.png assets/images/adaptive-icon.png
          fi
          
          # Run prebuild immediately in this session
          npx expo prebuild --platform android
      - name: Build Android APK for Low-End Devices
        script: |
          cd android
          # Force gradle properties to enable New Architecture as required by Reanimated v4
          echo "newArchEnabled=true" >> gradle.properties
          
          # Run build with heavy R8 compression and Hermes engine optimization
          ./gradlew assembleRelease -PminifyWithR8=true -PjavascriptEngine=hermes
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
