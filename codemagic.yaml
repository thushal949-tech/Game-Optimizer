workflows:
  android-build:
    name: Android Low End Optimized Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - supabase_keys
      vars:
        NODE_VERSION: 20.x
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate .env file
        script: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
      - name: Fix Icon Assets Folder Path
        script: |
          # Create the folders and copy icon.jpg as icon.png to bypass expo prebuild check
          mkdir -p assets/images
          cp icon.jpg assets/images/icon.png
          cp icon.jpg assets/images/adaptive-icon.png
      - name: Run Expo Prebuild
        script: |
          npx expo prebuild --platform android
      - name: Build Android APK for Low-End Devices
        script: |
          cd android
          ./gradlew assembleRelease -PminifyWithR8=true -PjavascriptEngine=hermes
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
